name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p ${{ matrix.python }} && uv pip install -e '.[dev]'
      - run: .venv/bin/pytest -q
      - run: python3 scripts/check_skills.py
      - run: .venv/bin/python scripts/tool_lock.py --check
      - run: .venv/bin/python scripts/security_card.py --check
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI is free; the GitHub Action needs a license for organization repos.
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact
      - name: Identifier scan
        env:
          IDENTIFIER_PATTERNS: ${{ secrets.IDENTIFIER_PATTERNS }}
        run: python3 scripts/scan_identifiers.py .
