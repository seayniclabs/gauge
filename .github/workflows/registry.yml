name: registry
# Publishes server.json to the MCP registry (io.github.seayniclabs/gauge) after a release reaches PyPI.
# Uses GitHub OIDC: the org namespace needs it (an interactive `mcp-publisher login github` cannot read org roles).
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.8
      MCP_PUBLISHER_SHA256: 09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: server.json matches the package version
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python3 - "$v" <<'PY'
          import json, sys
          v = sys.argv[1]; d = json.load(open("server.json"))
          bad = [x for x in [d["version"], *[p["version"] for p in d["packages"]]] if x != v]
          sys.exit(f"server.json version != {v}: {bad}" if bad else 0)
          PY
      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          curl -fsSL -o mp.tgz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mp.tgz" | sha256sum -c -
          tar xzf mp.tgz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
