[project]
name = "gauge-mcp"
version = "0.2.0"
description = "MCP bundle for people running a small website: web analytics (Umami) and email (Resend) in one server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seaynic Labs" }]
# mcp is capped below 2: 2.x removed FastMCP, and unpinned installs crash.
dependencies = [
    "mcp[cli]>=1.27,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
]
keywords = ["mcp", "model-context-protocol", "umami", "resend", "analytics", "email"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/seayniclabs/gauge"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gauge-mcp = "gauge_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gauge_mcp"]

# One source for the skills: the repo's skills/ folder ships inside the package too,
# so the server can serve it as MCP prompts and resources.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "gauge_mcp/skills"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "tests", "scripts", "README.md", "LICENSE", "CREDITS.md", "CHANGELOG.md", "server.json", ".claude-plugin", ".mcp.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
